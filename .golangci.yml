version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
  settings:
    staticcheck:
      # Keep correctness checks; omit style and simplification suggestions.
      checks:
        - SA*
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The existing S3 backend still uses AWS SDK v1.
      - linters:
          - staticcheck
        path: pkg/proxy/recorderstorage/s3\.go
        text: 'SA1019:.*github\.com/aws/aws-sdk-go'
    paths:
      - cmd/demo
      - cmd/i18ntool
      - data
      - locale
      - docs
      - ui
      - .git
      - pkg/utils/terminal.go

formatters:
  exclusions:
    paths:
      - cmd/demo
      - cmd/i18ntool
      - data
      - locale
      - docs
      - ui
      - .git
      - pkg/utils/terminal.go

output:
  formats:
    text:
      path: stdout
      colors: true
