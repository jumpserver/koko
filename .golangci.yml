version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
  exclusions:
    paths:
      - cmd/demo
      - cmd/i18ntool
      - data
      - locale
      - docs
      - ui
      - .git
      - pkg/utils/terminal.go

formatters:
  exclusions:
    paths:
      - cmd/demo
      - cmd/i18ntool
      - data
      - locale
      - docs
      - ui
      - .git
      - pkg/utils/terminal.go

output:
  formats:
    text:
      path: stdout
      colors: true
