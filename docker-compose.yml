services:
  koko:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: ${KOKO_IMAGE:-koko:dev}
    privileged: true
    environment:
      CORE_HOST: ${CORE_HOST:-http://host.docker.internal:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?BOOTSTRAP_TOKEN must be set}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      KOKO_PRIVILEGED: ${KOKO_PRIVILEGED:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${KOKO_SSH_PORT:-2222}:2222
      - ${KOKO_HTTP_PORT:-5000}:5000
    volumes:
      - ./data:/opt/koko/data
    healthcheck:
      test: [CMD, check, http://127.0.0.1:5000/koko/health/]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
