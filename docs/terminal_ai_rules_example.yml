# TerminalAI 业务加强规则。业务规则只能追加提示词或收紧内置策略。
version: 1

rules:
  # 全局规则：对所有 TerminalAI 会话追加管理要求。
  - id: global-change-policy
    priority: 10
    enforce:
      prompt_append:
        - 变更系统配置前，先说明影响范围并优先执行只读检查。
      reason: 全局变更管理要求

  # SSH Linux 规则：匹配 ConnectToken 中已有的平台信息。
  - id: ssh-linux-privileged-command
    priority: 20
    match:
      protocols:
        - ssh
      base_os:
        - linux
      command_regex:
        - '(^|\s)(sudo|su)(\s|$)'
        - '(^|\s)(systemctl|service)(\s|$)'
    enforce:
      minimum_risk: 3
      require_approval: true
      max_execution_seconds: 120
      reason: Linux 特权和服务管理命令需要审批

  # 连接后二次匹配：依赖实际探测到的 OS、Shell 和可用命令。
  - id: detected-production-linux
    priority: 30
    match:
      protocols:
        - ssh
      os_ids:
        - debian
        - ubuntu
        - rhel
        - rocky
      shells:
        - '*/bash'
        - '*/zsh'
      available_commands:
        - systemctl
    enforce:
      prompt_append:
        - 当前资产已识别为 Linux 主机；涉及服务变更时必须先读取当前状态。
      reason: 连接后 Linux 画像规则

  # 网络设备规则：强制命令在当前可见 PTY 中执行。
  - id: network-device-pty
    priority: 20
    match:
      protocols:
        - ssh
        - telnet
      platform_names:
        - '*Cisco*'
        - '*Huawei*'
        - '*H3C*'
    enforce:
      force_pty: true
      prompt_append:
        - 网络设备命令必须符合当前 CLI 模式，不得假设已经进入配置视图。
      reason: 网络设备依赖当前 CLI 模式

  # MySQL 数据变更规则：在内置 SQL 分析基础上进一步收紧。
  - id: mysql-data-change
    priority: 20
    match:
      protocols:
        - mysql
        - mariadb
      command_regex:
        - '^\s*(insert|update|delete|replace|alter|drop|truncate)\b'
    enforce:
      minimum_risk: 3
      require_approval: true
      max_execution_seconds: 60
      reason: 数据库变更命令需要审批

  # 精确资产规则：资产 ID 是最高优先级的稳定匹配条件。
  - id: critical-asset
    priority: 100
    match:
      asset_ids:
        - replace-with-asset-id
    enforce:
      prompt_append:
        - 当前资产属于关键资产，任何操作都必须先完成只读确认。
      require_approval: true
      force_pty: true
      max_execution_seconds: 30
      reason: 关键资产保护策略

  # labels、node_ids 和 attributes 已支持匹配，但第一版 ConnectToken
  # 尚未提供资产标签和节点；应在后续 Core API 规则数据源接入后使用。
