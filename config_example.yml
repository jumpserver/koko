# 项目名称, 会用来向Jumpserver注册, 识别而已, 不能重复
# NAME: {{ Hostname }}

# Jumpserver项目的url, api请求注册会使用
CORE_HOST: http://127.0.0.1:8080

# Bootstrap Token, 预共享秘钥, 用来注册coco使用的service account和terminal
# 请和jumpserver 配置文件中保持一致，注册完成后可以删除
BOOTSTRAP_TOKEN: <PleasgeChangeSameWithJumpserver>

# 启动时绑定的ip, 默认 0.0.0.0
# BIND_HOST: 0.0.0.0

# 监听的SSH端口号, 默认2222
# SSHD_PORT: 2222

# 监听的HTTP/WS端口号，默认5000
# HTTPD_PORT: 5000

# Web forward proxy 默认开启并仅监听本机。
# 使用 * 时只允许绑定在回环地址；绑定非回环地址时必须显式配置目标域名白名单。
WEB_PROXY_ENABLED: true
WEB_PROXY_BIND_HOST: 127.0.0.1
WEB_PROXY_PORT: 5001
WEB_PROXY_ALLOWED_HOSTS: "*"
WEB_PROXY_RECORDING_ENABLED: true
WEB_PROXY_FFMPEG_PATH: ffmpeg

# 设置日志级别 [DEBUG, INFO, WARN, ERROR, FATAL, CRITICAL]
# LOG_LEVEL: INFO

# SSH连接超时时间 (default 15 seconds)
# SSH_TIMEOUT: 15

# Api Http请求的超时时间 (default 30 seconds)
# HTTP_REQUEST_TIMEOUT: 30

# 语言 [en,zh]
# LANGUAGE_CODE: zh

# SFTP是否显示隐藏文件
# SFTP_SHOW_HIDDEN_FILE: false

# 是否复用和用户后端资产已建立的连接(用户不会复用其他用户的连接)
# REUSE_CONNECTION: true

# 资产加载策略, 可根据资产规模自行调整. 默认异步加载资产, 异步搜索分页; 如果为all, 则资产全部加载, 本地搜索分页.
# ASSET_LOAD_POLICY:

# zip压缩的最大额度 (单位: M)
# ZIP_MAX_SIZE: 1024M

# zip压缩存放的临时目录 /tmp
# ZIP_TMP_PATH: /tmp

# 向 SSH Client 连接发送心跳的时间间隔 (单位: 秒)，默认为30, 0则表示不发送
# CLIENT_ALIVE_INTERVAL: 30

# 向资产发送心跳包的重试次数，默认为3
# RETRY_ALIVE_COUNT_MAX: 3

# 会话共享使用的类型 [local, redis], 默认local
# SHARE_ROOM_TYPE: local

# Redis配置
# REDIS_HOST: 127.0.0.1
# REDIS_PORT: 6379
# REDIS_PASSWORD:
# REDIS_CLUSTERS:
# REDIS_DB_ROOM:
# REDIS_SENTINEL_HOSTS:
# REDIS_SENTINEL_PASSWORD:
# REDIS_USE_SSL: false

# Lion / Guacamole 配置。Lion 路由默认启用；guacd 不可用不会影响 Koko 启动。
# 多个 guacd 地址以逗号分隔；设置后优先于 GUA_HOST/GUA_PORT。
# GUACD_ADDRS:
# GUA_HOST: 127.0.0.1
# GUA_PORT: 4822

# Lion drive 清理周期（小时）；小于 1 时禁用。
# JUMPSERVER_CLEAN_DRIVE_SCHEDULE_TIME: 1
# LION_DRIVE_SCOPE: user

# Lion 分片录像大小上限（字节）及录像输入记录配置。
# REPLAY_MAX_SIZE: 314572800
# DISABLE_KEYBOARD_RECORD: false

# VNC 剪贴板编码。
# VNC_CLIPBOARD_ENCODING:

# 虚拟应用与录像转换服务。
# ENABLE_PANDA: false
# PANDA_HOST: http://panda:9001
# ENABLE_VIDEO_WORKER: false
# VIDEO_WORKER_HOST: http://video:9000
# IGNORE_VERIFY_CERTS: false

# 是否开启本地转发 (目前仅对 vscode remote ssh 有效果)
# ENABLE_LOCAL_PORT_FORWARD: false

# 是否开启 针对 vscode 的 remote-ssh 远程开发支持 (前置条件: 必须开启 ENABLE_LOCAL_PORT_FORWARD )
# ENABLE_VSCODE_SUPPORT: false

# KoKo 是否以 privileged 权限运行。为 false 时，Kubernetes 集群连接会提示部署权限不足
# KOKO_PRIVILEGED: true
