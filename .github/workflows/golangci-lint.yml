name: golangci-lint
on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare libghostty for CGO analysis
        run: |
          echo "PKG_CONFIG_PATH=$(./utils/setup-libghostty-vt.sh)/lib/pkgconfig" >> "$GITHUB_ENV"

      # Root ./... does not descend into nested modules. Keep dbkit driver-independent.
      - name: Test shared database contracts
        working-directory: pkg/dbkit
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          test "$(go list -m all)" = "$(go list -m)"
          go test -mod=readonly ./...

      - name: Test WebCLI with the release CGO setting
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: go test -mod=readonly ./tools/usql/...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: v2.12.2

          # Optional: working directory, useful for monorepos
          # working-directory: somedir

          # Optional: golangci-lint command line arguments.
          # args: --issues-exit-code=0

          # Optional: show only new issues if it's a pull request. The default value is `false`.
          # only-new-issues: true

          # Optional: if set to true then the all caching functionality will be complete disabled,
          #           takes precedence over all other caching options.
          # skip-cache: true

          # Optional: if set to true then the action don't cache or restore ~/go/pkg.
          # skip-pkg-cache: true

          # Optional: if set to true then the action don't cache or restore ~/.cache/go-build.
          # skip-build-cache: true
