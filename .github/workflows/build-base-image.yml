name: Build and Push Base Image

on:
  push:
    branches:
      - 'pr*'
    paths:
      - '.github/workflows/build-base-image.yml'
      - 'go.mod'
      - 'Dockerfile-base'
  workflow_dispatch:
    inputs:
      branch:
        description: '构建基础镜像所用的分支'
        required: true
        type: string
        default: 'dev'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract date
        id: vars
        run: echo "IMAGE_TAG=$(date +'%Y%m%d_%H%M%S')" >> "$GITHUB_ENV"

      - name: Extract repository name
        id: repo
        run: echo "REPO=$(basename "${{ github.repository }}")" >> "$GITHUB_ENV"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile-base
          tags: jumpserver/${{ env.REPO }}-base:${{ env.IMAGE_TAG }}
          context: .
          cache-from: type=gha,scope=koko-base
          cache-to: type=gha,mode=max,scope=koko-base

      - name: Update Dockerfile
        run: |
          sed -i -E "s|^(FROM jumpserver/${REPO}-base:)[^[:space:]]+|\1${IMAGE_TAG}|" Dockerfile
          if ! grep -Fq "FROM jumpserver/${REPO}-base:${IMAGE_TAG}" Dockerfile; then
            echo "::error::Base image reference was not updated in Dockerfile"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          if git diff --cached --quiet -- Dockerfile; then
            echo "Base image tag is already up to date; skipping commit."
            exit 0
          fi
          git commit -m "perf: Update Dockerfile with new base image tag"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
